name: Sync leads → Supabase

# Hourly at :13 + manual trigger. Sync ~12k rows + ~3k HubSpot enrichments.
# Deliberately skips 04:00-07:59 UTC (06:00-10:00 SAST): under the conservative
# 1 req/10s throttle a run is long and serialized, and when one landed in the
# 08:29 SAST (06:29 UTC) window it collided with the n8n morning burst and
# tripped HubSpot's portal-wide secondary (burst) rate limit, 429-ing n8n
# (Caller QC, deal creation, Mailchimp, WhatsApp). The 4h gap (last start 03:13
# UTC, next 08:13 UTC) keeps the SA morning clear even for a multi-hour full
# run; :13 stays off the busy :00/:30 marks.
on:
  schedule:
    - cron: '13 0-3,8-23 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you triggering a manual sync?'
        required: false
        default: 'on demand'
      backfill_days:
        description: 'team_activity backfill window (default 3; use 45 for first run)'
        required: false
        default: '3'

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # At the owner-requested 1 req/10s throttle a full run (incl. whole-book deal
    # ingest) takes ~2-3h; 240 gives headroom. Drop back to 60 when HS_THROTTLE_S
    # is restored to ~0.35 (fast runs finish in ~1-2 min).
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        working-directory: scripts
        run: pip install -r requirements.txt

      - name: Run leads sync
        working-directory: scripts
        env:
          HUBSPOT_TOKEN:        ${{ secrets.HUBSPOT_TOKEN }}
          SUPABASE_URL:         https://dqszbqiimbfvmmnpgpsb.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GCP_SA_JSON:          ${{ secrets.GCP_SA_JSON }}
        run: python3 sync.py

      - name: Run team-activity sync
        working-directory: scripts
        env:
          HUBSPOT_TOKEN:        ${{ secrets.HUBSPOT_TOKEN }}
          SUPABASE_URL:         https://dqszbqiimbfvmmnpgpsb.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 team_activity_sync.py --days ${{ github.event.inputs.backfill_days || '3' }}
